# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'que villano envia el mensaje?'
        required: true
        type: choice
        options:
          - joker
          - riddler
          - penguin

      mensaje:
        description: 'mensaje para el consejo'
        required: true
        default: 'la mision fue un exito'

      cow_character:
        description: 'cows characters'
        required: true
        default: 'tux'
        type: choice
        options:
          - tux
          - dragon
          - bunny
          - ghostbusters
          - chessmen
          - goat

      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - critica    
jobs:
   transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay   



      - name: Imprimir inputs
        run: |
          echo "______________________________"
          echo "transmision interceptada"
          echo "______________________________"
          echo ""
          echo "de: ${{inputs.villano}}"
          echo ""
          echo "fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "-----mensaje------"
          cowsay -f ${{inputs.cow_character}} "${{inputs.mensaje}}"
          echo ""
          echo --${{inputs.villano}}--
          echo ...