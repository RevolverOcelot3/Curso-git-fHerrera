# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'que villano envia el mensaje?'
        required: true
        type: choice
        options:
          - joker
          - riddler
          - penguin

      mensaje:
        description: 'mensaje para el consejo'
        required: true
        default: 'la mision fue un exito'

      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - critica    
jobs:
   transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
         echo "inputs: "
         echo ""
         echo "villano: ${{inputs.villano}}"
         echo "prioridad: ${{inputs.prioridad}}"
         echo "mensaje: ${{inputs.mensaje}}"
          
          